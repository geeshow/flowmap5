apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowmap-web
  namespace: flowmap
  annotations:
    # 사내 ingress controller 에 맞게 조정.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: flowmap.corp.example.com   # ← 사내 호스트명으로 교체
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowmap-web
                port: { number: 80 }
