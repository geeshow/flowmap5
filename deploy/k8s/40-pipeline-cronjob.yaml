# 분석 파이프라인 — 주기 실행. 대상 repo pull → 분석 → web/data 생성(PV 기록).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flowmap-pipeline
  namespace: flowmap
spec:
  schedule: "0 18 * * *"        # 매일 18:00 (UTC 기준 — 사내 TZ 고려해 조정)
  concurrencyPolicy: Forbid     # 이전 실행이 안 끝났으면 건너뜀
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pipeline
              image: registry.corp.example.com/flowmap/pipeline:latest   # ← 사내 레지스트리
              # 전체 파이프라인. 단계 부분실행 하려면 args: ["12","13","14"] 처럼 지정.
              # args: []
              env:
                - name: HOME
                  value: /work
                - name: TZ
                  value: Asia/Seoul
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  # git 자격증명 설정(사내 git pull 용)
                  git config --global credential.helper store
                  install -m600 /secrets/git-credentials /work/.git-credentials
                  # 분석기별 flowmap.config 주입
                  cp /config/spring.config  flowmap-spring/flowmap.config
                  cp /config/nexcore.config flowmap-nexcore/flowmap.config
                  cp /config/react.config   flowmap-react/flowmap.config
                  # 파이프라인 실행 (산출물 web/data 는 PV)
                  exec bash sh/run-all.sh
              volumeMounts:
                - name: data                       # 산출물 → PV
                  mountPath: /work/web/data
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: git-creds
                  mountPath: /secrets
                  readOnly: true
                # 분석 대상 소스. 사내 소스 PV 를 마운트하거나, run-all 의 pull 단계가
                # 사내 git 에서 /sources 아래로 clone 하도록 구성한다(REPO 경로와 일치).
                - name: sources
                  mountPath: /sources
              resources:
                requests: { cpu: "1",  memory: 2Gi }
                limits:   { cpu: "2",  memory: 4Gi }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: flowmap-data }
            - name: config
              configMap: { name: flowmap-pipeline-config }
            - name: git-creds
              secret: { secretName: flowmap-git-credentials }
            - name: sources
              emptyDir: {}     # ← 사내 소스 PVC 로 교체 가능(영속 작업트리 캐시)
