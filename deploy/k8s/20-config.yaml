# 파이프라인 런타임 설정 — 머신별 flowmap.config 들을 컨테이너에 주입.
#   각 분석기는 자기 디렉터리의 flowmap.config 에서 REPO=<분석 대상 소스 루트> 를 읽는다.
#   폐쇄망에선 REPO 가 사내 git 에서 clone 된 작업트리를 가리키거나, 소스 PV 마운트를 가리킨다.
#
#   아래 값은 예시 — 실제 사내 git URL/경로로 채울 것.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowmap-pipeline-config
  namespace: flowmap
data:
  # flowmap-spring/flowmap.config  (백엔드 Kotlin 분석 대상)
  spring.config: |
    REPO=/sources/backend
  # flowmap-nexcore/flowmap.config (nexcore 모노레포 분석 대상)
  nexcore.config: |
    NAMESPACE=kakaopay
    REPO=/sources/nexcore
  # flowmap-react/flowmap.config   (프론트 분석 대상 + 백엔드 결합 CSV)
  react.config: |
    REPO=/sources/frontend
    BACKEND=../flowmap-spring/json/_combined.json
---
# 사내 git 인증(분석 대상 repo clone/pull 용). 실제 토큰으로 교체.
apiVersion: v1
kind: Secret
metadata:
  name: flowmap-git-credentials
  namespace: flowmap
type: Opaque
stringData:
  # git 이 사내 호스트에 대해 사용할 자격증명. 예) https 토큰을 .git-credentials 형식으로.
  git-credentials: |
    https://CI_USER:CI_TOKEN@git.corp.example.com
