server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 라우팅은 URL 파라미터(?view=...) 기반 — 경로 라우팅 아님.
    # 실제 파일(/web/..., /web/data/...)은 그대로 서빙, 그 외는 index.html 로.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 데이터는 파이프라인이 매 실행마다 갱신 → 캐시 짧게(또는 no-cache).
    # 정적 자산은 index.html 의 ?v= 쿼리로 캐시 버스팅하므로 길게 가능.
    location /web/data/ {
        add_header Cache-Control "no-cache";
    }

    # .gz 산출물은 앱이 fetch 후 JS DecompressionStream 으로 직접 해제한다.
    # nginx 가 gzip transfer-encoding 을 덧씌우면 안 되므로 gzip_static 켜지 않는다.
    location ~ \.gz$ {
        add_header Cache-Control "no-cache";
        types { } default_type application/gzip;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
